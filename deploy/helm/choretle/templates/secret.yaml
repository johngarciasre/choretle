{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "choretle.secretName" . }}
  labels:
    {{- include "choretle.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "choretle.databaseUrl" . | quote }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: {{ .Values.supabase.anonKey | quote }}
  WEBSUDO_SECRET: {{ .Values.websudoSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
