apiVersion: v1
kind: Service
metadata:
  name: {{ include "choretle.fullname" . }}
  labels:
    {{- include "choretle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "choretle.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
