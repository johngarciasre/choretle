apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "choretle.fullname" . }}
  labels:
    {{- include "choretle.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Migrations run as a Job (see migrate-job.yaml), never from a request path.
  AUTO_MIGRATE: "0"
  NEXT_PUBLIC_SUPABASE_URL: {{ .Values.supabase.url | quote }}
