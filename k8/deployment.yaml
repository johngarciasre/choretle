apiVersion: apps/v1
kind: Deployment
metadata:
  name: choretle
  namespace: choretle
  labels:
    app: choretle
spec:
  # SQLite is a single-file database: one replica owns it. Scale out only after
  # moving to a shared database (see AGENTS.md).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: choretle
  template:
    metadata:
      labels:
        app: choretle
    spec:
      containers:
        - name: choretle
          image: choretle:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapKeyRef:
                name: choretle-config
            - secretKeyRef:
                name: choretle-secrets
                optional: true
          env:
            - name: SQLITE_PATH
              value: /data/choretle.db
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/auth/me
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: choretle-data
