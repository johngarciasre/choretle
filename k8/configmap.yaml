apiVersion: v1
kind: ConfigMap
metadata:
  name: choretle-config
  namespace: choretle
data:
  NODE_ENV: "production"
  PORT: "3000"
  # ─── Auth ───────────────────────────────────────────────────────────
  # Supabase is required in production. AUTH_MODE=dev exists for local
  # development only and must never be set on a deployment: it lets anyone
  # holding a signed dev cookie act as a family member.
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "replace-with-anon-key"
  # ─── Database ───────────────────────────────────────────────────────
  # SQLite file on the persistent volume mounted by the Deployment.
  SQLITE_PATH: /data/choretle.db
  # ─── Secrets ────────────────────────────────────────────────────────
  # WEBSUDO_SECRET is intentionally not defaulted; put it in choretle-secrets.
