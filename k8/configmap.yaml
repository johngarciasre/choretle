apiVersion: v1
kind: ConfigMap
metadata:
  name: choretle-config
  namespace: choretle
data:
  NODE_ENV: "production"
  AUTH_MODE: "dev"
  PORT: "3000"
  # ─── Supabase (required in production) ──────────────────────────────
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "replace-with-anon-key"
  # ─── Database (set POSTGRES_URL for PostgreSQL, omit for SQLite) ───
  # POSTGRES_URL: "postgresql://user:pass@postgres-svc:5432/choretle"
  # ─── Optional secrets (filled from Secret below) ────────────────────
  WEBSUDO_SECRET: ""
